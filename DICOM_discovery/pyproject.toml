[build-system]
requires = ["setuptools>=77"]  # PEP 639 license / license-files
build-backend = "setuptools.build_meta"

[project]
name = "DICOM_discovery"
version = "0.11.1"
description = "Cohort-level QC for longitudinal radiotherapy (DICOM-RT) data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# The repo-root LICENSE is mirrored into this package directory because a build only sees
# this subdirectory (`pip install "git+…#subdirectory=DICOM_discovery"`); a test keeps the
# two copies identical.
license-files = ["LICENSE"]
authors = [{ name = "Vivian Metzger" }]
keywords = ["dicom", "radiotherapy", "dicom-rt", "data-curation", "quality-control", "oncology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=1.3",
    "pydicom>=2.3",
    "jsonschema>=4.0",
    "pyyaml>=5.1",
    "plotly>=5.0",
]

[project.urls]
Homepage = "https://github.com/vivirtuose/DICOM_discovery"
Source = "https://github.com/vivirtuose/DICOM_discovery/tree/master/DICOM_discovery"
Changelog = "https://github.com/vivirtuose/DICOM_discovery/blob/master/DICOM_discovery/CHANGELOG.md"
Issues = "https://github.com/vivirtuose/DICOM_discovery/issues"
"NAS deployment guide" = "https://github.com/vivirtuose/DICOM_discovery/blob/master/DICOM_discovery/docs/NAS_DEPLOYMENT.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
dicom-discovery = "DICOM_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The synthetic generators deliberately use the pydicom write API that is valid on BOTH
# pydicom 2.4 (the only line that supports Python 3.9) and pydicom 3.x. pydicom 3.x warns
# that this API is slated for removal in 4.0; that migration is blocked until the 3.9 leg is
# dropped, so these three known DeprecationWarnings are silenced as expected noise.
filterwarnings = [
    "ignore:.*is_little_endian.*:DeprecationWarning",
    "ignore:.*is_implicit_VR.*:DeprecationWarning",
    "ignore:.*write_like_original.*:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "synth", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Minimum target is Python 3.9: keep typing.Dict/List/Optional (UP006/UP045) rather than
# PEP585/604 builtins so the annotations stay valid on the whole 3.9-3.13 matrix. E501 (line
# length) and E702 (intentional compact rows in the synthetic data generators) are allowed.
ignore = ["E501", "E702", "UP006", "UP035", "UP045"]
