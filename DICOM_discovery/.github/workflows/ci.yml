name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src synth tests

      - name: Test (pytest)
        run: pytest
