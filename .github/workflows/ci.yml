name: CI

# The Python package lives in the DICOM_discovery/ subdirectory of this repo, so every
# run step executes there via the working-directory default. No PHI ever reaches CI: the
# synthetic tiers generate their own DICOM, the real-data tier (T2b) fetches a public,
# de-identified TCIA chain that is cached and skips when unavailable, and a dedicated job
# fails the build if any DICOM file is ever tracked in git. Full real-cohort runs live in a
# separate, opt-in workflow (real-cohort.yml), never on push/PR.
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: DICOM_discovery

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src synth tests bench

      # Cache the public TCIA chain (tier 2b) across the matrix so we hit the network at most
      # once; a cache miss + unreachable TCIA makes the tier skip, never fail.
      - name: Cache real-data RT chain (TCIA, public)
        uses: actions/cache@v4
        with:
          path: DICOM_discovery/tests/.cache
          key: vs-seg-001-rtchain-v1

      - name: Test (pytest)
        run: pytest

  test-os:
    # The README promises Linux / macOS / Windows. Ubuntu alone cannot back that claim: the
    # bugs this leg catches are path-, case- and encoding-shaped (the cp1252 console crash
    # fixed in 0.8 was exactly that family). Two Python versions per OS — the oldest and the
    # newest supported — keep the signal without a full second matrix.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      # No TCIA cache here: the tier skips when the chain is absent, and these legs exist to
      # exercise the local filesystem, not the network.
      - name: Test (pytest)
        run: pytest

  no-dicom-in-git:
    # Governance gate: .gitignore is a convention, not a barrier (git add -f bypasses it).
    # Fail hard if any DICOM file is ever tracked, so real/PHI data can't slip into history.
    name: no DICOM tracked in git
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any *.dcm / *.ima is tracked
        run: |
          if git ls-files | grep -iE '\.(dcm|ima)$'; then
            echo "::error::DICOM files must never be committed to this repository"; exit 1
          fi
          echo "OK: no tracked DICOM files"

  proof:
    # Proof-of-work: build the tool from a clean install, synthesise an open cohort, and run
    # the real report + verdict-JSON pipeline end-to-end. The artifacts are the evidence the
    # package works — downloadable from the run summary. No PHI: the cohort is generated here.
    name: proof-of-work (synthetic cohort)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (one-command install path)
        run: pip install -e .

      - name: Generate synthetic longitudinal cohort (no PHI — synthesised here)
        run: python synth/generate_longitudinal_cohort.py --out-dir examples/longitudinal_cohort

      - name: Run the real report + verdict pipeline
        run: >
          dicom-discovery report
          --root examples/longitudinal_cohort
          --out cohort_report.html
          --json verdicts.json

      - name: Upload proof-of-work artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cohort-report
          path: |
            DICOM_discovery/cohort_report.html
            DICOM_discovery/verdicts.json
          if-no-files-found: error
