name: NAS bundle

# Builds what a hospital NAS / air-gapped server needs, proves it runs under NAS-like
# constraints, and uploads it as downloadable artifacts (nothing is published to a registry):
#   * the Docker image (amd64 + arm64) as a `docker load`-able tarball;
#   * an offline pip wheelhouse per Python version (Linux x86_64) + install script.
# Synthetic data only — no PHI ever reaches CI.
on:
  push:
    branches: [master, nas-deployment]
    tags: ["v*"]
    paths:
      - "DICOM_discovery/**"
      - ".github/workflows/nas-bundle.yml"
  pull_request:
    paths:
      - "DICOM_discovery/**"
      - ".github/workflows/nas-bundle.yml"
  workflow_dispatch:
  workflow_call: # used by release.yml so a tag ships the same, already-proven artifacts

jobs:
  image:
    name: docker image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Package version
        id: v
        run: echo "version=$(grep -m1 '^version' DICOM_discovery/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: DICOM_discovery
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: |
            dicom-discovery:${{ steps.v.outputs.version }}
            dicom-discovery:latest

      - name: Smoke test under NAS constraints (no network, read-only share and rootfs, non-root)
        env:
          IMG: dicom-discovery:${{ steps.v.outputs.version }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -eu
          mkdir -p share out
          HARDEN="--platform $PLATFORM --network none --read-only --tmpfs /tmp --cap-drop ALL \
                  --security-opt no-new-privileges:true --user $(id -u):$(id -g)"
          # A synthetic cohort (no PHI), generated by the image itself.
          docker run --rm $HARDEN -v "$PWD/share:/work" "$IMG" demo --out-dir /work
          # Preflight only: must write nothing.
          docker run --rm $HARDEN -v "$PWD/share/longitudinal_cohort:/data:ro" -v "$PWD/out:/output" \
            "$IMG" job --root /data --output-dir /output --dry-run
          test -z "$(ls -A out)"
          # The image's default command = the scheduled NAS run.
          docker run --rm $HARDEN -v "$PWD/share/longitudinal_cohort:/data:ro" -v "$PWD/out:/output" "$IMG"
          test -s out/latest/cohort_report.html
          test -s out/latest/verdicts.json
          python3 - <<'EOF'
          import json, sys
          s = json.load(open("out/last_run.json"))
          print(json.dumps(s, indent=2))
          sys.exit(0 if s["status"] == "success" and s["n_patients"] > 0 else 1)
          EOF
          # A second, overlapping run must be refused (exit 75), not corrupt the first.
          touch out/.dicom-discovery.lock
          rc=0; docker run --rm $HARDEN -v "$PWD/share/longitudinal_cohort:/data:ro" -v "$PWD/out:/output" "$IMG" || rc=$?
          test "$rc" -eq 75

      - name: Export image for offline NAS install
        run: |
          docker save "dicom-discovery:${{ steps.v.outputs.version }}" dicom-discovery:latest \
            | gzip -6 > "dicom-discovery-${{ steps.v.outputs.version }}-${{ matrix.arch }}.tar.gz"
          sha256sum dicom-discovery-*.tar.gz | tee "dicom-discovery-${{ steps.v.outputs.version }}-${{ matrix.arch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dicom-discovery-${{ steps.v.outputs.version }}-image-${{ matrix.arch }}
          path: dicom-discovery-*.tar.gz*
          if-no-files-found: error
          retention-days: 90

  wheelhouse:
    # Offline pip bundles: every wheel (package + dependencies + a recent pip) for one
    # Python version on one platform, installable with no package index at all. Linux covers
    # the NAS/server target across the whole supported range; Windows and macOS get the two
    # versions a laptop is most likely to have.
    name: wheelhouse (py${{ matrix.python }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9", platform: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.10", platform: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.11", platform: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.12", platform: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.13", platform: linux-x86_64 }
          - { os: ubuntu-latest, python: "3.14", platform: linux-x86_64 }
          - { os: windows-latest, python: "3.12", platform: windows-amd64 }
          - { os: windows-latest, python: "3.13", platform: windows-amd64 }
          - { os: macos-latest, python: "3.12", platform: macos-arm64 }
          - { os: macos-latest, python: "3.13", platform: macos-arm64 }
    defaults:
      run:
        shell: bash
        working-directory: DICOM_discovery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build the wheelhouse (package + every dependency as binary wheels, + pip)
        run: |
          set -eu
          python -m pip install --upgrade pip
          mkdir -p bundle/wheelhouse
          pip wheel . --wheel-dir bundle/wheelhouse
          pip download pip --only-binary=:all: --dest bundle/wheelhouse
          cp deploy/nas/install-offline.sh deploy/nas/install-offline.ps1 protocol.brain_rt_followup.yaml bundle/
          ls bundle/wheelhouse

      - name: Prove the offline install works — POSIX installer (no package index)
        if: runner.os != 'Windows'
        run: |
          set -eu
          PIP_NO_INDEX=1 sh bundle/install-offline.sh "$RUNNER_TEMP/dd"
          DD="$RUNNER_TEMP/dd/venv/bin/dicom-discovery"
          "$DD" --version
          "$DD" demo --out-dir "$RUNNER_TEMP/demo"
          "$DD" job --root "$RUNNER_TEMP/demo/longitudinal_cohort" --output-dir "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/latest/cohort_report.html"

      - name: Prove the offline install works — Windows installer (no package index)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: DICOM_discovery
        run: |
          $env:PIP_NO_INDEX = "1"
          $dest = Join-Path $env:RUNNER_TEMP "dd"
          & ./bundle/install-offline.ps1 -Dest $dest
          $dd = Join-Path $dest "venv/Scripts/dicom-discovery.exe"
          & $dd --version
          & $dd demo --out-dir (Join-Path $env:RUNNER_TEMP "demo")
          & $dd job --root (Join-Path $env:RUNNER_TEMP "demo/longitudinal_cohort") --output-dir (Join-Path $env:RUNNER_TEMP "out")
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP "out/latest/cohort_report.html"))) { throw "no report produced" }

      - name: Package
        id: pkg
        run: |
          set -eu
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          NAME="dicom-discovery-$V-wheelhouse-py${{ matrix.python }}-${{ matrix.platform }}"
          tar -czf "$NAME.tar.gz" -C bundle .
          python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest(), ' ', p)" "$NAME.tar.gz" | tee "$NAME.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: DICOM_discovery/${{ steps.pkg.outputs.name }}.tar.gz*
          if-no-files-found: error
          retention-days: 90
